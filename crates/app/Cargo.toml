[package]
name = "daw-app"
description = "Application de bureau : interface web (Tauri) branchée sur le moteur"
version = "0.1.0"
edition = "2021"
publish = false

# Espace de travail à part : voir le Cargo.toml racine (`exclude`).
[workspace]

[dependencies]
# Tauri 2 (MIT/Apache-2.0) : fenêtre native + moteur web du système (WebView2 sous Windows). `custom-protocol` :
# sert les fichiers de la page embarqués dans l'exécutable (sans lui, une compilation « release » chercherait un serveur).
tauri = { version = "2", features = ["custom-protocol"] }
# Dialogues natifs (ouvrir / enregistrer / confirmer) : plugin officiel de Tauri (MIT/Apache-2.0), mêmes appels sous
# Windows, macOS et Linux.
tauri-plugin-dialog = "2"
serde_json = "1"
daw-core-types = { path = "../core-types" }
daw-audio-io = { path = "../audio-io" }
daw-engine = { path = "../engine" }
daw-session = { path = "../session" }
daw-ui = { path = "../ui" }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
