# Paquets de test du DAW pour Windows, macOS (Apple Silicon) et Linux, publiés comme Release GitHub.
# Déclenchement MANUEL seulement. Les paquets contiennent les plugins CLAP de l'auteur (récupérés dans leurs Releases, voir packaging/).
# Rien n'est signé par un compte payant : le paquet macOS est signé « ad hoc » (gratuit), Windows et Linux ne sont pas signés.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la Release à créer (ex. v0.1.0-test1) ; elle ne doit pas exister"
        required: true
      prerelease:
        description: "Marquer comme pré-version (version de test)"
        type: boolean
        default: true
      publish:
        description: "Créer la Release (sinon : seulement construire les paquets, en artefacts)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write

jobs:
  windows:
    name: Paquet Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app
      # SDK ASIO : téléchargé chez Steinberg (double licence Steinberg ASIO / GPLv3, GPLv3 choisie), jamais copié dans le dépôt.
      - name: SDK ASIO (téléchargement)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.steinberg.net/asiosdk -OutFile "$env:RUNNER_TEMP\asiosdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\asiosdk.zip" -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1
          if (-not (Test-Path "$($sdk.FullName)\common\iasiodrv.h")) { throw "SDK ASIO : common/iasiodrv.h introuvable" }
          "ASIO_SDK_DIR=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compilation (release)
        run: cargo build --release --manifest-path crates/app/Cargo.toml
      - name: Assemblage du paquet
        run: |
          D="DAW-${{ inputs.tag }}-Windows-x64"
          mkdir -p "$D/plugins"
          cp crates/app/target/release/daw-app.exe "$D/"
          python packaging/fetch_plugins.py --os windows --dest "$D/plugins"
          cp packaging/LISEZMOI-paquet.md "$D/LISEZMOI.md"; cp LICENSE THIRD-PARTY-LICENSES.md "$D/"
          7z a -tzip "$D.zip" "$D" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-windows
          path: DAW-*-Windows-x64.zip

  linux:
    name: Paquet Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pkg-config libasound2-dev libjack-jackd2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Compilation (release)
        run: cargo build --release --manifest-path crates/app/Cargo.toml
      - name: Assemblage du paquet
        run: |
          D="DAW-${{ inputs.tag }}-Linux-x64"
          mkdir -p "$D/plugins"
          cp crates/app/target/release/daw-app "$D/"
          cp packaging/lancer-linux.sh "$D/lancer.sh"
          python3 packaging/fetch_plugins.py --os linux --dest "$D/plugins"
          cp packaging/LISEZMOI-paquet.md "$D/LISEZMOI.md"; cp LICENSE THIRD-PARTY-LICENSES.md "$D/"
          tar czf "$D.tar.gz" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-linux
          path: DAW-*-Linux-x64.tar.gz

  macos:
    name: Paquet macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app
      - name: Compilation (release)
        run: cargo build --release --manifest-path crates/app/Cargo.toml
      - name: Assemblage de DAW.app
        run: |
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; VERSION="${VERSION%%-*}"
          APP="DAW.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/plugins"
          cp crates/app/target/release/daw-app "$APP/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/Info.plist.template > "$APP/Contents/Info.plist"
          # Icône provisoire (PNG 1024) -> icon.icns
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s crates/app/icons/provisoire-1024.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s*2)) $((s*2)) crates/app/icons/provisoire-1024.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          python3 packaging/fetch_plugins.py --os macos --dest "$APP/Contents/Resources/plugins"
          cp LICENSE THIRD-PARTY-LICENSES.md "$APP/Contents/Resources/"
          # Signature « ad hoc » (gratuite, sans compte Apple), en UNE passe sur tout le paquet APRÈS la copie des plugins :
          # une signature faite avant serait invalidée par l'ajout de fichiers.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          D="DAW-${{ inputs.tag }}-macOS-arm64"
          mkdir "$D"
          cp -R "$APP" "$D/"
          cp packaging/LISEZMOI-paquet.md "$D/LISEZMOI.md"
          ditto -c -k --keepParent "$D" "$D.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-macos
          path: DAW-*-macOS-arm64.zip

  release:
    name: Publication de la Release
    needs: [windows, linux, macos]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - name: Création de la Release
        run: |
          ls -l paquets
          cat > notes.md <<'NOTES'
          **Version de test, non signée, sans garantie.** Écrite et vérifiée surtout sous Windows (UMC 1820, ASIO) ; **le paquet macOS n'a jamais été essayé sur un vrai Mac**.

          | Système | Fichier | Remarques |
          |---|---|---|
          | Windows x64 | `…-Windows-x64.zip` | décompresser, lancer `daw-app.exe` (WebView2 requis, présent sous Windows 11) |
          | macOS Apple Silicon (arm64) | `…-macOS-arm64.zip` | non notarisé : clic droit sur `DAW.app` puis « Ouvrir », ou `xattr -cr DAW.app` |
          | Linux x64 | `…-Linux-x64.tar.gz` | WebKitGTK 4.1 requis ; `./lancer.sh` (son via JACK / PipeWire) |

          Contient 21 plugins CLAP de l'auteur (dossier `plugins`). Neptune et Sillage sont arm64 seulement sous macOS. Voir `LISEZMOI.md` dans chaque paquet.
          Licences : DAW GPLv3 ; plugins Neptune et Sillage AGPLv3, LowLatConv GPLv3+ (détail dans `THIRD-PARTY-LICENSES.md`).
          NOTES
          FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${{ inputs.tag }}" paquets/* --title "DAW ${{ inputs.tag }} (version de test)" --notes-file notes.md --target "${{ github.sha }}" $FLAGS
